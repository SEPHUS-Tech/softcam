name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./softcam.sln

jobs:
  codeql:
    name: Analyze
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write   # upload the CodeQL results
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed
        configuration: [Release]
        platform: [x64, Win32]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build Libraries
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{matrix.configuration}} /p:Platform=${{matrix.platform}} ${{env.SOLUTION_FILE_PATH}}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # The gitleaks action needs a paid licence key on an organisation account; the container does not.
    - name: Scan the full history for secrets
      run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  dependencies:
    # audits: packages.config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: List the inputs and check their licences against the allow-list
      run: ./scripts/checks/check_licenses.sh

    - name: Outdated dependencies (reported only)
      continue-on-error: true
      run: |
        echo "No registry query is made. Pinned versions:"
        echo "  Microsoft.googletest.v140.windesktop.msvcstl.static.rt-dyn 1.8.1.7"
        echo "  pybind11 2.13.6"

    - name: State the scope of the dependency audit
      run: |
        echo "No vulnerability database is consulted for these inputs."
        echo "They are restored by NuGet and downloaded by a batch script, not tracked by a package manager this job can audit."

  surface:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Check that every manifest has an audit job
      run: ./scripts/checks/check_audit_coverage.sh
